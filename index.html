<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<header class="header">
    <h1>SpendWise</h1>
    <p>Smart Budget and Expense Tracker</p>
</header>

<main class="container">

    <section class="welcome">
        <h2>Budget Dashboard</h2>
        <p>Track your expenses and manage your money wisely.</p>
    </section>

    <!-- Summary Cards -->
    <section class="dashboard">

        <div class="card">
            <h3>Total Budget</h3>
            <p id="budget-display">KSh 0.00</p>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="expense-display">KSh 0.00</p>
        </div>

        <div class="card">
            <h3>Remaining Balance</h3>
            <p id="balance-display">KSh 0.00</p>
        </div>

    </section>

    <!-- Add Expense -->
    <section class="expense-form-section">

        <h2>Add Expense</h2>

        <form id="expense-form">

            <div class="form-group">
                <label for="expense-name">Expense Name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="e.g. Food"
                    required
                >
            </div>

            <div class="form-group">
                <label for="expense-amount">Amount (KSh)</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="e.g. 500"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="expense-category">Category</label>

                <select id="expense-category" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Savings">Savings</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit">Add Expense</button>

        </form>

        <p id="message"></p>

    </section>

    <!-- Expense Table -->
    <section class="table-section">

        <h2>Expense History</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                </tr>
            </thead>

            <tbody id="expense-list">
                <!-- JavaScript adds expenses here -->
            </tbody>
        </table>

    </section>

</main>

<footer>
    <p>&copy; 2026 SpendWise Budget Tracker</p>
</footer>

<script src="script.js"></script>
```

</body>
</html>
